# GeoGym server: live 1v1 (one "Room" Durable Object per game code, WebSockets) and the Daily leaderboard (one "Board" per date).
# Deployed separately from the site (Cloudflare Workers Builds, root directory "multiplayer"). See README.md.
name = "geography-gym-multiplayer"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
# Served at https://geography-gym-multiplayer.jtharper32.workers.dev (the site connects there; no custom domain needed)

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]
