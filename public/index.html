<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geography Gym</title>
<meta name="description" content="Geography Gym: free geography quizzes. Flags, capitals, maps, shapes, neighbors, currencies, US states and more.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  try {
    var t = localStorage.getItem("geography-gym-theme") || localStorage.getItem("flag-atlas-theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#practice">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
    Geography Gym
  </a>
  <div class="top-right">
    <div class="progress-mini" aria-live="polite">
      <span id="meterText"><b>0</b> learned</span>
      <span class="bar"><span id="meterFill"></span></span>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="pop-wrap gear-wrap">
      <button class="icon-btn" id="setBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="setPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <div class="pop panel" id="setPanel" hidden>
        <h2 class="panel-title">Settings <span id="setTopic"></span></h2>
        <div class="field">
          <label for="regionSel">Region</label>
          <select id="regionSel"></select>
        </div>
        <div class="field">
          <span id="styleLbl">Answer with</span>
          <div class="seg soft" role="group" aria-labelledby="styleLbl" id="styleSeg">
            <button type="button" data-style="choice">Choices</button>
            <button type="button" data-style="type">Typing</button>
            <button type="button" data-style="reverse">Flags</button>
          </div>
        </div>
        <label class="toggle-row" for="terrToggle" id="terrRow"><span>Include territories</span><input type="checkbox" class="switch" role="switch" id="terrToggle"></label>
        <label class="toggle-row" for="soundToggle"><span>Sounds</span><input type="checkbox" class="switch" role="switch" id="soundToggle"></label>
        <button type="button" class="link-btn" id="resetBtn">Reset progress</button>
      </div>
    </div>
    <div class="pop-wrap topic-wrap">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">
        <span id="menuLabel">Country flags</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <nav class="pop menu" id="menu" aria-label="Topic" hidden>
        <div class="menu-list" id="topicList"></div>
      </nav>
    </div>
  </div>
</header>
<nav class="modes" id="modeNav" aria-label="Mode">
  <a href="#practice" data-view="practice">Practice</a>
  <a href="#quiz" data-view="quiz">Quiz</a>
  <a href="#name-all" data-view="name-all">Name them</a>
  <a href="#browse" data-view="browse">Browse</a>
</nav>

<main>
  <div id="loading" class="loading">Loading flags…</div>
  <section class="view" id="view-practice" hidden></section>
  <section class="view" id="view-quiz" hidden></section>
  <section class="view wide" id="view-name-all" hidden>
    <div class="na-bar">
      <input id="naInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a country name" aria-label="Type a country name">
      <span class="na-stat"><b id="naFound">0</b> / <span id="naTotal">0</span></span>
      <span class="na-stat" id="naTime">0:00</span>
      <button class="btn" id="naGiveUp" type="button">Give up</button>
      <button class="btn" id="naRestart" type="button">Restart</button>
    </div>
    <div id="naBanner"></div>
    <div id="naBoard"></div>
  </section>
  <section class="view wide" id="view-browse" hidden>
    <div class="browse-bar">
      <div class="seg" role="group" aria-label="Show" id="brTabs">
        <button type="button" id="brAll" aria-pressed="true">All flags</button>
        <button type="button" id="brLook" aria-pressed="false">Look-alikes</button>
      </div>
      <input type="search" id="brSearch" placeholder="Search" aria-label="Search flags">
      <label class="toggle-row" for="brHide"><span>Hide names</span><input type="checkbox" class="switch" role="switch" id="brHide"></label>
    </div>
    <div id="browseBody"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
