<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGym – free geography quizzes: flags, capitals, maps and more</title>
<meta name="description" content="46 free geography quizzes: country flags, capitals, maps, shapes, lakes, rivers, landmarks, US states and more. Practice, race the clock, or play the daily challenge. No sign-up.">
<link rel="canonical" href="https://geogym.party/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GeoGym">
<meta property="og:title" content="GeoGym – free geography quizzes">
<meta property="og:description" content="46 free quizzes: flags, capitals, maps, landmarks and more, plus a daily challenge. No sign-up.">
<meta property="og:url" content="https://geogym.party/">
<meta property="og:image" content="https://geogym.party/cards/home.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GeoGym – free geography quizzes">
<meta name="twitter:description" content="46 free quizzes: flags, capitals, maps, landmarks and more, plus a daily challenge. No sign-up.">
<meta name="twitter:image" content="https://geogym.party/cards/home.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#15171c">
<link rel="preload" href="fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  try {
    var t = localStorage.getItem("geography-gym-theme") || localStorage.getItem("flag-atlas-theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    // Look: ?look=pop in the address wins, then the saved one
    var SK = { pop: "light", arcade: "dark", explorer: "light", tropical: "light", chalk: "dark" };
    var q = (location.search.match(/[?&]look=([a-z]+)/) || [])[1];
    var k = q || localStorage.getItem("geography-gym-look");
    if (SK[k]) { document.documentElement.dataset.skin = k; document.documentElement.dataset.theme = SK[k]; }
    else if (k === "clean" || k === "clean-dark") document.documentElement.dataset.theme = k === "clean" ? "light" : "dark";
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=202611181633">
<link rel="stylesheet" href="themes.css?v=202611181633">
</head>
<body>
<header class="top">
  <a class="logo" href="#practice">
    <img class="logo-mark" src="logo.svg" alt="" width="30" height="30">
    <span class="logo-text">GeoGym</span>
  </a>
  <div class="top-right">
    <div class="progress-mini" aria-live="polite">
      <span id="meterText"><b>0</b> learned</span>
      <span class="bar"><span id="meterFill"></span></span>
    </div>
    <div class="pop-wrap look-wrap">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Change the look" aria-expanded="false" aria-controls="lookPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.2" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
      </button>
      <div class="pop look" id="lookPanel" hidden>
        <div class="look-title">Look</div>
        <div class="looks" id="looks"></div>
      </div>
    </div>
    <div class="pop-wrap gear-wrap">
      <button class="icon-btn" id="setBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="setPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <div class="pop panel" id="setPanel" hidden>
        <h2 class="panel-title">Settings <span id="setTopic"></span></h2>
        <div class="field">
          <label for="regionSel">Region</label>
          <select id="regionSel"></select>
        </div>
        <div class="field">
          <span id="styleLbl">Answer with</span>
          <div class="seg soft" role="group" aria-labelledby="styleLbl" id="styleSeg">
            <button type="button" data-style="choice">Choices</button>
            <button type="button" data-style="type">Typing</button>
            <button type="button" data-style="reverse">Flags</button>
          </div>
        </div>
        <label class="toggle-row" for="terrToggle" id="terrRow"><span>Include territories</span><input type="checkbox" class="switch" role="switch" id="terrToggle"></label>
        <label class="toggle-row" for="soundToggle"><span>Sounds</span><input type="checkbox" class="switch" role="switch" id="soundToggle"></label>
        <button type="button" class="link-btn" id="resetBtn">Reset progress</button>
      </div>
    </div>
    <div class="pop-wrap topic-wrap">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">
        <span id="menuLabel">Country flags</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <nav class="pop menu" id="menu" aria-label="Topic" hidden>
        <div class="menu-tabs" id="menuTabs" role="tablist" aria-label="Topic groups"></div>
        <div class="menu-list" id="topicList"></div>
        <a class="menu-all" href="/quizzes/">All quizzes and answer lists</a>
      </nav>
    </div>
  </div>
</header>
<nav class="modes" id="modeNav" aria-label="Mode">
  <a href="#practice" data-view="practice">Practice</a>
  <a href="#quiz" data-view="quiz">Quiz</a>
  <a href="#name-all" data-view="name-all">Name them</a>
  <a href="#browse" data-view="browse">Browse</a>
</nav>

<main>
  <div id="loading" class="loading">Loading flags…</div>
  <section class="view" id="view-practice" hidden></section>
  <section class="view" id="view-quiz" hidden></section>
  <section class="view" id="view-special" hidden></section>
  <section class="view wide" id="view-name-all" hidden>
    <div class="na-bar">
      <input id="naInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a country name" aria-label="Type a country name">
      <span class="na-stat"><b id="naFound">0</b> / <span id="naTotal">0</span></span>
      <span class="na-stat" id="naTime">0:00</span>
      <button class="btn" id="naGiveUp" type="button">Give up</button>
      <button class="btn" id="naRestart" type="button">Restart</button>
    </div>
    <div id="naBanner"></div>
    <div id="naBoard"></div>
  </section>
  <section class="view wide" id="view-browse" hidden>
    <div class="browse-bar">
      <div class="seg" role="group" aria-label="Show" id="brTabs">
        <button type="button" id="brAll" aria-pressed="true">All flags</button>
        <button type="button" id="brLook" aria-pressed="false">Look-alikes</button>
      </div>
      <input type="search" id="brSearch" placeholder="Search" aria-label="Search flags">
      <label class="toggle-row" for="brHide"><span>Hide names</span><input type="checkbox" class="switch" role="switch" id="brHide"></label>
    </div>
    <div id="browseBody"></div>
  </section>
</main>
<script src="app.js?v=202611181633"></script>
</body>
</html>
